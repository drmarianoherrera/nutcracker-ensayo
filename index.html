<title>The Nutcracker · Ensayo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: festivo, cálido y claro — un programa de teatro navideño que un niño de 1º puede usar.
   IDEA: el programa de mano de la obra; cada personaje es una esfera del árbol, cada acto un boleto.
   PICTURE: escenario con telón rojo, árbol verde, estrella dorada y nieve sobre azul navidad.
   COLOUR and TYPE: azul navidad dominante, verde navidad de apoyo, rojo caramelo y dorado de acento; Fraunces + Nunito.
   LAYOUT: una columna en móvil; mosaico de 2–4 columnas en escritorio; controles de ensayo fijos abajo, al alcance del pulgar. */
:root{color-scheme:light dark;
  --red:#C8102E;--red2:#9E0B23;--green:#0B6B3A;--green2:#074D29;--blue:#0B2A5B;--blue2:#123E8C;--gold:#D9A21B;--gold2:#A77A0E;--silver:#7C879A;
  --bg:light-dark(#FFFBF3,#081A38);--card:light-dark(#FFFFFF,#0F2550);--ink:light-dark(#1A1F2B,#F4EEDF);--muted:light-dark(#5C6475,#B6BFD3);
  --line:light-dark(#EADFCB,#23396A);--soft:light-dark(#F6EEDD,#132C5C);--mine:light-dark(#FFF3CF,#3A2E07);}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100dvh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.08;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
.narrow{max-width:760px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--blue);color:#FFF8E8;padding-top:env(safe-area-inset-top);box-shadow:0 2px 10px #0003}
.top::after{content:"";display:block;height:6px;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,#fff 10px 20px)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 16px 8px 12px;border-radius:99px;background:var(--gold);color:var(--blue);min-height:44px;font-weight:800;box-shadow:0 3px 0 #A77A0E,0 4px 12px #0005;flex:none}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 #A77A0E}
.homeb{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--red);box-shadow:0 3px 0 #0003;flex:none}.homeb svg{width:22px;height:22px}
.back svg{width:20px;height:20px;flex:none}
@media(max-width:600px){.top h1{font-size:16px}.back{padding:8px 12px 8px 8px}}
.lang{display:inline-flex;background:#ffffff1f;border-radius:99px;padding:3px}
.lang button{padding:6px 11px;border-radius:99px;font-weight:800;font-size:14px;min-height:38px}
.lang button.on{background:var(--gold);color:var(--blue)}

/* portada */
.hero{background:var(--blue);color:#FFF8E8;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:28px 0}
.hero .hbar{display:flex;justify-content:space-between;align-items:flex-start;padding-top:14px}
.crest{background:#fff;border-radius:16px;padding:6px 8px;box-shadow:0 4px 14px #0006;display:inline-grid;place-items:center}.crest img{display:block;height:64px;width:auto}
@media(min-width:700px){.crest img{height:84px}}
.foot img{display:block;margin:0 auto 6px;border-radius:6px}
.hero h1{font-size:clamp(40px,7vw,68px);font-weight:800;color:#FFF8E8}
.hero h1 span{display:block;color:var(--gold);font-size:.42em;font-weight:600;letter-spacing:.01em;margin-bottom:6px}
.hero p{font-size:17px;max-width:34ch;color:#DCE4F5;margin:14px 0 0}
.hero svg{width:100%;height:auto;display:block}
.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 28px)}
@media(max-width:700px){.hero .wrap{grid-template-columns:1fr;padding-top:8px;gap:8px}.hero svg{max-width:420px;margin:0 auto}}

/* tarjetas de menú */
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 8px}
.tile{border-radius:20px;padding:18px 16px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;box-shadow:0 6px 16px #0b2a5b26;transition:transform .15s}
.tile:active{transform:scale(.97)}
@media(hover:hover){.tile:hover{transform:translateY(-3px)}}
.tile b{font-family:Fraunces,serif;font-size:21px;line-height:1.1}
.tile small{font-size:14px;opacity:.92;line-height:1.35}
.tile svg{width:34px;height:34px;margin-bottom:auto}
.t-red{background:linear-gradient(150deg,var(--red),var(--red2))}
.t-green{background:linear-gradient(150deg,var(--green),var(--green2))}
.t-blue{background:linear-gradient(150deg,var(--blue2),var(--blue))}
.t-gold{background:linear-gradient(150deg,var(--gold),var(--gold2))}
.sec-title{font-size:26px;margin:26px 0 12px}
.lead{margin:0 0 14px;color:var(--muted)}

/* boletos de acto */
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:900px){.acts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ticket{position:relative;border-radius:16px;padding:16px;color:#fff;text-align:left;min-height:120px;display:flex;flex-direction:column;gap:4px}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.ticket .n{font-family:Fraunces,serif;font-size:30px;font-weight:800;line-height:1}
.ticket .s{font-size:14px;opacity:.95;line-height:1.3}
.a1{background:linear-gradient(150deg,var(--red),var(--red2))}
.a2{background:linear-gradient(150deg,var(--blue2),var(--blue))}
.a3{background:linear-gradient(150deg,var(--gold),var(--gold2))}
.a4{background:linear-gradient(150deg,var(--green),var(--green2))}

/* personajes */
.grp{margin:20px 0 8px;font-size:18px;color:var(--muted);font-family:Nunito,sans-serif;font-weight:800}
.cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(min-width:640px){.cast{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:960px){.cast{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:transform .15s}
.cc:active{transform:scale(.96)}
@media(hover:hover){.cc:hover{transform:translateY(-3px);box-shadow:0 8px 18px #0b2a5b1f}}
.cc svg{width:56px;height:66px}
.cc b{font-size:14px;line-height:1.15}
.cc small{font-size:13px;color:var(--muted)}

/* ficha de personaje */
.who{display:flex;gap:14px;align-items:center;margin:20px 0 10px}
.who svg{width:72px;height:86px;flex:none}
.who h2{font-size:clamp(28px,5vw,40px)}
.who p{margin:4px 0 0;color:var(--muted)}
.note{background:var(--soft);border-left:5px solid var(--gold);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px}
.note b{display:block;font-size:13px;color:var(--gold2);margin-bottom:2px}
:root[data-theme=dark] .note b{color:var(--gold)}
.actrow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;margin-bottom:10px}
.actrow .dot{width:44px;height:44px;border-radius:12px;color:#fff;font-family:Fraunces,serif;font-weight:800;font-size:20px;display:grid;place-items:center;grid-row:span 2}
.actrow h3{font-size:17px;font-family:Nunito,sans-serif;font-weight:800}
.actrow .cnt{font-size:14px;color:var(--muted)}
.actrow .btns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actrow.off{opacity:.55}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:99px;font-weight:800;min-height:44px;font-size:15px}
.p-red{background:var(--red);color:#fff}.p-green{background:var(--green);color:#fff}.p-blue{background:var(--blue2);color:#fff}
.p-ghost{background:var(--soft);color:var(--ink)}.p-gold{background:var(--gold);color:var(--blue)}
.pill svg{width:18px;height:18px}
.pill[disabled]{opacity:.4;cursor:not-allowed}
.big{width:100%;margin:6px 0 14px}

/* herramientas */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:14px 0}
.tools .lbl{font-size:14px;color:var(--muted);font-weight:700}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px}
.seg button{padding:7px 12px;border-radius:99px;font-size:14px;font-weight:800;min-height:38px}
.seg button.on{background:var(--blue2);color:#fff}
.prog{margin-left:auto;font-weight:800;font-size:14px;background:var(--green);color:#fff;padding:7px 12px;border-radius:99px}

/* líneas */
.lc{background:var(--card);border:2px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.lc.done{border-color:var(--green)}
.ctx{background:var(--soft);padding:9px 14px;font-size:14px;color:var(--muted)}
.ctx b{color:var(--ink)}
.lb{padding:14px}
.lt{font-family:Fraunces,Georgia,serif;font-size:19px;line-height:1.45;font-weight:600}
.paren{font-style:italic;color:var(--muted);font-size:14px;margin-bottom:4px}
.tr{font-size:14px;color:var(--muted);margin-top:6px}
.tr b{color:var(--green)}
.la{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.veil{display:block;width:100%;text-align:left;border:2px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-weight:700}
.playing{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.65}}

/* ensayo */
.stage{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.prev{font-size:15px;color:var(--muted);padding:10px 14px;border-left:4px solid var(--line);margin:12px 0}
.prev b{color:var(--ink)}
.now{background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 26px #0b2a5b1a}
.now.mine{border:4px solid var(--gold);background:var(--mine)}
.turn{background:linear-gradient(90deg,var(--red),var(--gold));color:#fff;text-align:center;font-weight:800;padding:8px;font-size:17px}
.nb{padding:18px}
.spk{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.spk svg{width:46px;height:54px;flex:none}
.spk b{display:block;font-size:17px}
.spk small{color:var(--muted);font-size:13px}
.now .lt{font-size:clamp(20px,4vw,26px)}
.pre{font-size:14px;font-style:italic;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.cue{display:flex;gap:12px;align-items:center;padding:18px;font-weight:800;font-size:18px}
.cue svg{width:40px;height:40px;flex:none;color:var(--gold)}
.nextp{font-size:14px;color:var(--muted);margin-top:12px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px #0b2a5b22;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.dock .wrap{display:flex;flex-direction:column;gap:8px}
.dock .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .3s}
.play{flex:1;max-width:280px}
.end{background:linear-gradient(140deg,var(--green),var(--green2));color:#fff;border-radius:20px;padding:22px;text-align:center;margin-top:16px}
.end h3{font-size:26px;margin-bottom:6px}
.end q{display:block;font-style:italic;margin:12px auto 0;max-width:46ch;opacity:.95}

/* lector de acto */
.script .row{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 12px;border-radius:14px;align-items:start}
.script .row.line{background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.one{float:right;width:44px;height:44px;border-radius:50%;background:var(--blue2);color:#fff;display:grid;place-items:center;margin:0 0 6px 8px}.one svg{width:18px;height:18px}.one.playing{background:var(--red)}
.script .row.cur{border:2px solid var(--gold);background:var(--mine)}
.script .row.hl{border-left:6px solid var(--red)}
.script .row svg{width:40px;height:47px}
.script .nm{font-weight:800;font-size:14px;letter-spacing:.01em}
.script .tx{font-family:Fraunces,Georgia,serif;font-size:17px;line-height:1.45;font-weight:600}
.script .dr{grid-column:1/-1;font-style:italic;color:var(--muted);font-size:14px;padding:2px 4px 10px}
.script .cueR{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-weight:800;color:var(--gold2);padding:6px 4px 12px;font-size:15px}
:root[data-theme=dark] .script .cueR{color:var(--gold)}
.script .cueR svg{width:22px;height:22px;flex:none}
.script h3.sc{grid-column:1/-1;font-size:20px;margin:10px 0}
select{font:inherit;font-size:16px;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--soft);color:var(--ink);min-height:40px;max-width:100%}

/* lectura */
.read h3{font-size:22px;margin:26px 0 10px}
.read p{max-width:68ch;margin:0 0 12px;font-size:17px}
.quote{font-family:Fraunces,serif;font-size:21px;line-height:1.4;border-left:5px solid var(--red);padding:6px 0 6px 16px;margin:18px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{background:var(--soft);border-radius:99px;padding:6px 12px;font-size:15px;font-weight:700}
.sw{display:inline-flex;align-items:center;gap:8px}
.sw i{width:18px;height:18px;border-radius:50%;border:1px solid #0002}
.lights{display:grid;gap:8px}
.lights div{display:grid;grid-template-columns:150px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
@media(max-width:560px){.lights div{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;margin:14px 0}
.tabs button{flex:none;padding:9px 14px;border-radius:99px;background:var(--soft);font-weight:800;min-height:42px;font-size:15px}
.tabs button.on{background:var(--red);color:#fff}
.foot{padding:30px 0 calc(30px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:40;background:var(--blue);color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;max-width:min(92vw,520px);box-shadow:0 8px 24px #0005;transition:.3s}#toast.show{opacity:1;transform:translate(-50%,0)}
.seqc .side{display:grid;grid-template-columns:72px 1fr 48px;gap:8px;align-items:start;padding:10px 12px;background:var(--soft);font-size:15px}
.seqc .side .sb div{color:var(--muted)}.seqc .side b{color:var(--ink)}.seqc .side i{color:var(--muted);font-size:13px}
.seqc .side.alsomine{background:var(--mine)}
.seqc .sl{font-size:13px;font-weight:800;text-transform:none;color:var(--muted);padding-top:3px}
.seqc .me .lt{font-size:22px}
.seqc .me{padding:16px;border-left:6px solid var(--gold);background:var(--mine)}
.seqc .me .sl{color:var(--red);font-size:17px;margin-bottom:4px}
.seqc .speaking{box-shadow:inset 0 0 0 3px var(--red)}
.seqbar{padding:10px 12px;border-top:1px solid var(--line)}.seqbar .pill{width:100%}
.mini{width:48px;height:48px;border-radius:50%;background:var(--blue2);color:#fff;display:grid;place-items:center}.mini svg{width:16px;height:16px}.mini.playing{background:var(--red)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cueS{display:flex;gap:8px;align-items:center;padding:6px 12px;font-size:14px;font-weight:800;color:var(--gold2);background:var(--soft)}.cueS svg{width:18px;height:18px;flex:none}
:root[data-theme=dark] .cueS{color:var(--gold)}
@media(max-width:480px){.seqc .side{grid-template-columns:1fr 48px}.seqc .side .sl{grid-column:1/-1;padding:0}}
.chipsT{font-weight:800;margin:16px 0 8px;font-size:17px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;padding:2px 0 10px}
.pc{min-height:96px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pc svg{width:40px;height:48px}.pc b{font-size:12.5px;line-height:1.15}.pc small{font-size:12px;color:var(--muted)}
.pc.on{border-color:var(--red);background:var(--mine)}
.pc .all{width:40px;height:48px;display:grid;place-items:center;color:var(--green)}.pc .all svg{width:30px;height:30px}
:root{--a1:light-dark(#FBE9EB,#2A0D14);--a2:light-dark(#E7EEFB,#0A1C44);--a3:light-dark(#FBF1D6,#2A2008);--a4:light-dark(#E5F3EA,#0A2A19)}
body[data-act="1"]{--bg:var(--a1)}body[data-act="2"]{--bg:var(--a2)}body[data-act="3"]{--bg:var(--a3)}body[data-act="4"]{--bg:var(--a4)}
body[data-act] .ticket::before,body[data-act] .ticket::after{background:var(--bg)}
body[data-act="1"] .top{background:#A50D26}body[data-act="2"] .top{background:#0B2A5B}body[data-act="3"] .top{background:#8A6000}body[data-act="4"] .top{background:#075230}
body[data-act] .dock{background:light-dark(#fff,#0F2550)}
body{transition:background-color .3s}
.warn{font-size:14px;background:var(--mine);border-radius:12px;padding:10px 12px;margin:10px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

S('The Stahlbaum Home – Christmas Eve'),
M('The Nutcracker Suite – Overture Miniature (“The Dance of the Sugar Plum Fairy”, modern version)'),
L('narr','A beautifully decorated Christmas tree stands center stage, adorned with candy, chocolates, sweets, and candy mice. Christmas presents are arranged beneath the tree. Marie and Fritz enter and stop in front of the Christmas tree.'),
D('(Music fades.)'),
L('marie','Oh, look at all the beautiful decorations on the Christmas tree! Look, Fritz! Mother decorated it with chocolates and candy!'),
L('fritz','What’s this?','taking one of the decorations'),
L('marie','Let me see… They’re candy mice!'),
D('The doorbell rings. Mr. and Mrs. Stahlbaum enter.'),
L('mrsS','That must be Herr Drosselmeyer.'),
D('Mr. and Mrs. Stahlbaum open the door.'),
L('drossel','Hello! Merry Christmas!'),
D('Herr Drosselmeyer carries two small gifts, while two large boxes remain on the floor outside.'),
L('mrsS','Please, come in.'),
L('drossel','It certainly is a very cold evening.'),
L('mrS','Marie! Fritz! Herr Drosselmeyer has arrived!'),
D('Marie and Fritz run to greet him.'),
L('mf','Good evening, Godfather!'),
L('drossel','Hello, children!'),
D('Mrs. Stahlbaum notices the large boxes.'),
L('mrsS','What have you brought in those large boxes?'),
L('drossel','You’ll see soon enough. It’s a surprise.'),
L('mrS','Let me help you carry them into the living room.'),
M('The Nutcracker, Op. 71 – The Presents of Drosselmeyer'),
L('narrator1','Herr Drosselmeyer and Mr. Stahlbaum carry the boxes inside. Everyone sits down. Herr Drosselmeyer makes a magical gesture, and two life-sized Harlequin dolls emerge from the boxes and begin to dance. Marie and Fritz watch in amazement. When the dance ends, the dolls return to their boxes.'),
D('(Music fades.)'),
L('fritz','You’re a wonderful magician!'),
L('drossel','Oh, that’s nothing. Just wait until you see what I’ve brought for you.'),
D('He makes another magical gesture and hands Fritz a gift.'),
L('fritz','Thank you! May I open it?'),
L('drossel','Of course.'),
D('Fritz opens the package.'),
L('fritz','Toy soldiers! Thank you!'),
D('Fritz hugs Herr Drosselmeyer.'),
L('mrsS','Fritz, you know where that gift belongs, don’t you?'),
L('fritz','Yes, I know. Under the Christmas tree.'),
D('Fritz places the gift beneath the tree.'),
L('marie','Godfather… don’t I get a present?'),
L('drossel','Of course you do. In fact, it’s the most special gift of all.'),
L('marie','Really? What is it?'),
D('Herr Drosselmeyer hands Marie a beautifully wrapped package. She carefully opens it.'),
L('marie','What a magnificent toy soldier!'),
L('drossel','It is a Nutcracker.'),
L('marie','It’s beautiful! Thank you so much, Godfather!'),
DA('Baile de 4º grado','4th grade dance'),
L('narrator2','Marie embraces the Nutcracker and dances joyfully around the stage. As the music comes to an end, Fritz playfully snatches the Nutcracker from her hands.'),
L('fritz','Let me try it! I’ll crack a few walnuts!'),
D('He picks up several walnuts and uses the Nutcracker. Suddenly, it breaks.'),
L('marie','Look what you’ve done! You broke my Nutcracker!'),
L('fritz','I’m sorry, Marie.'),
D('Marie begins to cry.'),
L('drossel','Don’t worry, my dear. I’ll fix it.'),
D('Herr Drosselmeyer carefully repairs the Nutcracker and returns it to Marie.'),
L('marie','Thank you, Godfather.'),
L('mrsS','Now put it back in its box and place it under the Christmas tree.'),
D('Marie gently places the Nutcracker back into its box and sets it beneath the tree.'),
L('mrsS','Come along, children. It’s time for bed.'),
L('mf','Good night, everyone!'),
D('Marie and Fritz kiss their parents and Herr Drosselmeyer goodnight before leaving the stage. The lights slowly fade to black.')

{n:'II',cls:'a2',t:{es:'La batalla con el Rey Ratón',en:'The Battle with the Mouse King'},e:[
S('The Battle with the Mouse King'),
L('narrator2','The lights rise slowly. Marie is asleep in her bedroom. After a moment, she awakens and quietly walks into the living room. The Christmas tree is dark, and the house is silent. She kneels beneath the tree, opens the box, and gently takes out the Nutcracker. Sitting on the sofa, she cradles him in her arms and soon falls asleep once more. Suddenly, the lights on the Christmas tree begin to glow. A loud crashing sound echoes through the room.'),
FX('El reloj de pie da las doce (efecto de reloj)','The grandfather clock strikes twelve (clock effects)'),
L('marie','What’s happening? Who turned on the Christmas tree lights? What was that noise?'),
DA('Baile de 1º y 2º grado','1st and 2nd grade dance'),
L('narr','Suddenly, the candy mice decorating the Christmas tree begin to move. One by one, they climb down from the branches and surround Marie.'),
L('marie','Oh! What’s happening? The little mice are alive!','Gasping'),
L('mouse1','Squeak! Squeak! Look what we have here!','Laughing'),
L('mouse2','A little girl! She looks frightened!'),
L('mouseKing','Silence, everyone! I am the mighty Mouse King! And tonight, this kingdom will belong to me!','Stepping forward proudly'),
L('marie','Who are you? Why are you here?','Taking a step backward'),
L('mouseKing','I have come to conquer this Christmas kingdom! No one can stop me!'),
L('narrator3','Suddenly, the toy soldiers begin to grow. Their tiny bodies become life-size, and the Nutcracker stands proudly at the front of the army.'),
L('toy1','We will never let you take over!','Raising his sword'),
L('toy2','We are ready to fight!'),
L('toy3','We are strong, and we will defend our kingdom!','Standing bravely'),
L('toy4','Together, we can defeat any enemy!','Raising his shield'),
L('toy1','Soldiers, stay together! We must protect our friends!','Looking at the others'),
L('toy2','For the kingdom! For the Nutcracker! Let’s fight!','Shouting confidently'),
L('nutcracker','Mouse King! Your evil plans end tonight!','Stepping forward bravely'),
F('Bonsoir, mes amis ! Bonsoir ! Où est le roi des souris ?','¡Buenas noches, amigos! ¡Buenas noches! ¿Dónde está el rey de los ratones?','Good evening, my friends! Good evening! Where is the king of the mice?'),
L('mouse3','Who are you? And why are you speaking that strange language?'),
L('mouseKing','You dare challenge me? You and your little soldiers are no match for my army!','Laughing loudly'),
L('nutcracker','We may be small, but we are brave. We will defend this kingdom!'),
S('The Battle Begins'),
L('narrator1','The Mouse King raises his gleaming sword and charges toward the toy soldiers. The Nutcracker raises his weapon, and both armies prepare for battle.'),
L('mouseKing','Attack! Forward, my brave mice! Defeat the soldiers!'),
L('mice','Charge! Charge! Long live the Mouse King!','Shouting'),
L('nutcracker','Soldiers, stand your ground! Protect Marie! For the kingdom!'),
L('toys','Yes, Captain! We will fight!','Together'),
L('marie','Oh no! They are going to hurt each other! Someone must stop this battle!','Worried'),
L('toy1','Take that, you sneaky mouse!','Fighting'),
L('mouse1','You haven’t seen the last of me!','Angrily'),
F('Nous sommes les plus puissants guerriers !','¡Somos los guerreros más poderosos!','We are the most powerful warriors!'),
L('mouse2','What he wants to say is: We are the most powerful warriors!'),
L('mouseKing','Prepare to face your doom, Nutcracker!','Charging forward'),
L('nutcracker','I am not afraid of you, Mouse King!'),
F('Respectez notre roi ! Vous apprendrez à nous craindre !','¡Respeten a nuestro rey! ¡Aprenderán a temernos!','Respect our king! You will learn to fear us!'),
D('The other mouse soldiers look at him, confused.'),
L('mouse2','He says: Respect our king, or you will learn to fear us!'),
L('narrator3','The battle becomes fiercer. Swords clash, drums beat, and the mice surround the toy soldiers. The Nutcracker bravely fights his way toward the Mouse King.'),
L('marie','The Nutcracker is in danger! I must help him!','Looking around desperately'),
L('mouseKing','Now, Nutcracker! This is the end!','Raising his sword'),
L('nutcracker','I will never surrender!','Raising his sword to defend himself'),
L('narrator2','Marie removes one of her shoes and throws it with all her strength at the Mouse King. The shoe strikes him squarely. He stumbles backwards and collapses.'),
L('mouse1','Oh no! The King has fallen!','Shocked'),
L('mouse2','What happened? Who threw that shoe?'),
L('mouse3','It was the girl! She defeated our mighty King!','Pointing at Marie'),
L('mouse1','Quick! We must help His Majesty!'),
F('Appelez le médecin royal ! Aidez notre roi ! Protégez-le !','¡Llamen al médico real! ¡Ayuden a nuestro rey! ¡Protéjanlo!','Call the royal doctor! Help our king! Protect him!'),
L('mouse2','Your Majesty, are you alright?','Helping the King up'),
L('mouseKing','Oh! What a terrible blow! I never expected such an attack!','Weakly'),
L('mouse3','We must retreat! The soldiers are too strong!'),
F('Oui ! Tout à fait ! C’est surprenant, sa force !','¡Sí! ¡Totalmente! ¡Qué fuerza tan sorprendente tiene!','Yes! Absolutely! Her strength is surprising!'),
L('mouse1','Come on, everyone! Let’s get the King out of here!'),
L('mouseKing','This is not over, Nutcracker! I shall return!','Angrily'),
L('mice','Retreat! Retreat!','Together'),
L('marie','No!'),
L('narrator1','Marie hurries to the Nutcracker’s side and helps him to his feet. As they stand together center stage, a magical light surrounds them. The Nutcracker slowly transforms. The soldier’s uniform fades away, revealing a handsome young Prince. The music softens.'),
FX('Efecto especial de sonido','Special sound effect'),
L('marie','You’ve become a real Prince…','In awe'),
L('prince','My dear Marie… your kindness has broken the spell. Come with me. Our journey is only beginning.'),
D('He offers her his hand. Marie smiles and takes it. Together they walk toward the shimmering light as the stage slowly fades to black.')
]},
{n:'III',cls:'a3',t:{es:'El Reino de los Dulces',en:'The Kingdom of Sweets'},e:[
S('The Kingdom of Sweets'),
D('The curtain rises. A soft winter light reveals a magnificent kingdom unlike anything Marie has ever seen. Crystal trees shimmer beneath a sky of silver and gold. Giant candies, sparkling flowers, and elegant arches decorate the stage. Marie and the Prince enter hand in hand, gazing in wonder at the magical world before them.'),
L('marie','Where are we?'),
L('prince','Welcome, Marie, to the Kingdom of Sweets… my home.'),
D('Joyful music begins. Children dressed as candies, chocolates, and sweets enter from every side of the stage. They dance gracefully, welcoming Marie and the Prince into the kingdom.'),
DA('1er y 2º baile','1st and 2nd dance'),
D('The dancers complete their performance and form a semicircle. A hush falls over the kingdom. The Sugar Plum Fairy enters with elegance and grace. She is greeted with a respectful bow by every member of the court.'),
L('sugar','Welcome home, Your Highness. Dear Marie, we have awaited your arrival. Your courage and kindness have broken the spell that held our Prince captive. Today we celebrate not only his freedom, but the triumph of a brave and compassionate heart.'),
D('She extends her hand toward Marie.'),
L('sugar','Please accept the gratitude of everyone in our kingdom.'),
D('Marie curtsies respectfully.'),
L('marie','Thank you. I only wanted to help my friend.'),
L('sugar','True kindness asks for nothing in return. That is why today we celebrate not only the Prince’s freedom, but your generous heart as well.','Smiling warmly'),
L('prince','This kingdom has long awaited a day of joy such as this. Let the celebration begin!'),
D('The music swells. One by one, dancers representing the magical delights of the kingdom enter the stage: Chocolate, Tea and Coffee Dancers, the Marzipan Shepherdesses, Mother Ginger and the Polichinelles. The Flowers return to perform a magnificent waltz. The Candy Children dance playfully around Marie before inviting her to join them. The Prince approaches and offers his hand.'),
L('prince','May I have this dance?'),
L('marie','I’d be honored.','Smiling'),
M('The Nutcracker, Op. 71 – Pas de Deux'),
D('Marie and the Prince dance together. As the music grows more powerful, the entire court joins them, creating a grand finale worthy of the enchanted kingdom.'),
L('sugar','May the joy you have brought to our kingdom remain with you, wherever life may lead.'),
D('The dance continues until Marie begins to lose her balance.'),
L('marie','Everything is spinning…'),
D('She grows dizzy. The Prince catches her gently before she collapses.'),
L('prince','Marie!'),
D('The music softens. The lights gradually dim. As the kingdom slowly fades into darkness, the magical world begins to disappear.'),
DA('Baile de 3º y 5º grado','3rd and 5th grade dance')
]},
{n:'IV',cls:'a4',t:{es:'Mañana de Navidad',en:'Christmas Morning'},e:[
S('Christmas Morning'),
D('The curtain rises. Soft rays of Christmas morning sunlight stream through the windows of the Stahlbaum home. Marie is asleep beneath the Christmas tree, the Nutcracker resting gently in her arms. For a moment, everything is perfectly still.'),
M('The Nutcracker, Op. 71 – Finale'),
D('The grandfather clock softly chimes. Marie slowly opens her eyes. She looks around in quiet amazement.'),
L('marie','I’m home… Was it only a dream?','Softly'),
D('She hugs the Nutcracker tightly. The doorbell rings twice. She places the Nutcracker beneath the tree and opens the door. Standing outside are Herr Drosselmeyer and his young nephew, Daniel. For an instant, Marie is speechless. He looks exactly like the Prince.'),
L('drossel','Good morning, Marie. Merry Christmas!'),
L('marie','Merry Christmas, Godfather.'),
L('drossel','I’d like you to meet my nephew… Daniel.'),
L('daniel','It’s a pleasure to meet you, Marie. Merry Christmas!','Bowing politely'),
L('marie','Merry Christmas…!','Unable to hide her surprise'),
D('She studies his face. Daniel smiles kindly.'),
L('drossel','Is something troubling you?','With a gentle twinkle in his eye'),
L('marie','No… It’s just… You remind me of someone. Someone very brave.'),
D('Herr Drosselmeyer exchanges a knowing glance with Daniel.'),
L('drossel','Christmas has a way of filling our hearts with wonderful memories, and sometimes with wonderful surprises.'),
D('Marie turns toward the Christmas tree. The Nutcracker is exactly where she left him. She smiles.'),
L('marie','Then perhaps, magic is real after all.'),
DA('Baile de 6º grado para cerrar la obra','6th grade dance to close the play'),
FX('Buenos deseos navideños en francés e inglés','Christmas wishes in French and English'),
L('all','Merry Christmas!'),
M('The Nutcracker Suite – Apotheosis'),
D('The company bows their heads as the music reaches its triumphant conclusion. The lights slowly fade to black.')
]}];

const STORY={
es:{syn:['Es Nochebuena en casa de la familia Stahlbaum, donde parientes y amigos se han reunido para celebrar. Su querido tío y padrino, Herr Drosselmeyer, llega con regalos y sorpresas encantadoras. Durante la velada entretiene a los niños con un cuento de títeres y luego presenta un espectáculo mágico con muñecos de tamaño real que bailan. Al final revela su regalo más especial: un hermoso Cascanueces, que le entrega a Marie.',
'Todos bailan, celebran y disfrutan juntos hasta que llega la hora de dormir. Marie se queda dormida abrazando a su Cascanueces. A medianoche comienza la magia: un grupo de ratones, encabezado por el temible Rey Ratón, aparece y asusta a Marie. Para su asombro, el Cascanueces cobra vida, se convierte en un soldado de tamaño real y dirige a un ejército de soldaditos de juguete en la batalla contra los ratones. Tras una lucha feroz, los ratones son derrotados.',
'Después, el Cascanueces lleva a Marie en un viaje mágico por la Tierra de las Nieves hasta el encantador Reino de los Dulces. Allí los reciben delicias de todo el mundo: chocolate español, café árabe, té chino y turrón ruso. Llega la Dama de los Dulces bailando con sus pequeños caramelos, seguida de las Flores del Reino con un elegante vals. Por último aparece el Hada de Azúcar. Marie y el Cascanueces bailan juntos hasta que ella se marea y se desmaya. Al despertar, se da cuenta de que todo fue un sueño maravilloso.'],
tale:['Había una vez un príncipe al que el malvado Rey Ratón convirtió en Cascanueces. Por su apariencia, las jóvenes del reino lo rechazaban, y vivió solo durante muchos años. Un día conoció a una princesa que supo mirar más allá de su aspecto. Ella lo aceptó tal como era y se volvieron grandes amigos. Furioso, el Rey Ratón empezó a atormentar a la princesa. El Cascanueces la defendió con valentía y retó al Rey Ratón a una batalla. Cuando por fin lo venció, el hechizo se rompió y el Cascanueces recuperó su verdadera forma: la de un apuesto príncipe.'],
epi:['Cada Navidad, innumerables públicos se reúnen para ver la historia de una niña, un regalo misterioso y un viaje a un mundo donde la valentía, la bondad y la imaginación triunfan sobre el miedo. Aunque cada montaje es único, el corazón de El Cascanueces no cambia. Nos recuerda que las grandes transformaciones no las logra solo la magia, sino la compasión, la lealtad y la disposición a creer en lo que no siempre se ve.',
'Si la aventura de Marie fue un sueño o un milagro, lo decide cada espectador. Quizá ese misterio sea el mayor regalo de la historia, pues invita a cada generación a redescubrir la maravilla que vive en la Navidad. Que esta edición inspire a los actores a poner sinceridad en cada papel, a los directores a encontrar belleza en cada escena y al público a salir del teatro con un poco más de esperanza de la que trajo. Porque cuando cae el telón y la música se apaga, la verdadera magia de El Cascanueces no termina: vive en cada corazón que decide creer.'],
quote:'Quizá algunos viajes empiezan en los sueños, y quizá la magia más verdadera es la bondad que llevamos al mundo cuando despertamos.',
fin:['Cada ensayo es una oportunidad para descubrir algo nuevo. Cada función es una oportunidad para compartir alegría. Que esta obra nos recuerde que la mayor magia de la Navidad no está en juguetes encantados ni en reinos lejanos, sino en la bondad, la amistad, la imaginación y la esperanza.','¡Mucho éxito en el escenario! (Break a leg!)']},
en:{syn:['It is Christmas Eve at the Stahlbaum family’s home, where relatives and friends have gathered to celebrate. Their beloved uncle and godfather, Herr Drosselmeyer, arrives carrying a variety of gifts and delightful surprises. During the evening, he entertains the children with a puppet story before presenting a magical performance featuring life-sized dancing dolls. Finally, he reveals his most special gift: a beautiful Nutcracker, which he gives to Marie.',
'Everyone enjoys dancing, celebrating, and spending time together until it is time for bed. Marie falls asleep holding her Nutcracker tightly in her arms. At midnight, magic begins. A group of mice, led by the fearsome Mouse King, appears and terrifies Marie. To her amazement, the Nutcracker comes to life, transforms into a life-sized soldier, and leads an army of toy soldiers into battle against the mice. After a fierce fight, the mice are defeated.',
'The Nutcracker then leads Marie on a magical journey through the Land of Snow before arriving in the enchanting Kingdom of Sweets. There they are welcomed by delicacies from around the world—Spanish chocolate, Arabian coffee, Chinese tea, and Russian nougat. The Candy Lady arrives dancing with her little sweets, followed by the Flowers of the Kingdom performing a graceful waltz. Finally, the Sugar Plum Fairy appears. Marie and the Nutcracker dance together until she becomes dizzy and faints. When she awakens, she realizes that everything has been a wonderful dream.'],
tale:['Once upon a time, there was a prince who was transformed into a Nutcracker by the evil Mouse King. Because of his appearance, the young women of the kingdom rejected him, and he lived alone for many years. One day he met a princess who looked beyond his appearance. She accepted him for who he truly was, and they became close friends. Enraged, the Mouse King began tormenting the princess. The Nutcracker bravely defended her and challenged the Mouse King to battle. When he finally defeated him, the spell was broken, and the Nutcracker was restored to his true form as a handsome prince.'],
epi:['Every Christmas, countless audiences gather to witness the story of a young girl, a mysterious gift, and a journey into a world where courage, kindness, and imagination triumph over fear. Though each production is unique, the heart of The Nutcracker remains unchanged. It reminds us that the greatest transformations are not brought about by magic alone, but by compassion, loyalty, and the willingness to believe in what cannot always be seen.',
'Whether Marie’s adventure was a dream or a miracle is left for each audience to decide. Yet perhaps that mystery is the story’s greatest gift, inviting every generation to rediscover the wonder that lives within the Christmas season. May this edition inspire performers to bring sincerity to every role, directors to find beauty in every scene, and audiences to leave the theater carrying a little more hope than they brought with them. For when the curtain falls and the music fades, the true magic of The Nutcracker does not end. It lives on in every heart that chooses to believe.'],
quote:'Perhaps some journeys begin in dreams, and perhaps the truest magic is the kindness we carry into the world when we awaken.',
fin:['Every rehearsal is an opportunity to discover something new. Every performance is an opportunity to share joy. May this production remind us that the greatest Christmas magic is found not in enchanted toys or distant kingdoms, but in kindness, friendship, imagination, and hope.','Break a leg!']}

const synth=window.speechSynthesis;let voices=[];let tok=0;
function loadV(){if(synth)voices=synth.getVoices()}

function pickVoice(lg,g){const pool=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lg));if(!pool.length)return null;
 const fem=/female|samantha|victoria|karen|moira|tessa|zira|susan|allison|ava|serena|fiona|amelie|audrey|marie|google us english|google français/i,mal=/male|daniel|alex|fred|tom|david|mark|aaron|arthur|thomas|nicolas|rishi|guy/i;
 const loc=pool.filter(v=>v.localService);const base=loc.length?loc:pool;const pref=base.filter(v=>/en-us|fr-fr/i.test(v.lang));const p=pref.length?pref:base;
 return (g==='f'?p.find(v=>fem.test(v.name)):g==='m'?p.find(v=>mal.test(v.name)&&!/female/i.test(v.name)):null)||p[0]}
const aud=new Audio();aud.preload='auto';let unlocked=false;
document.addEventListener('pointerdown',()=>{if(unlocked)return;unlocked=true;try{aud.src='data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq';const sil=aud.src;aud.play().then(()=>{if(aud.src===sil)aud.pause()}).catch(()=>{})}catch(e){}},{capture:true});
function stopVoice(){tok++;if(synth)synth.cancel();try{aud.pause()}catch(e){}}
let frWarned=false;
function say(e,onEnd){stopVoice();const my=tok;
 if(e.audio){let fin=false;const end=()=>{if(fin||my!==tok)return;fin=true;onEnd&&onEnd()};
  aud.onended=end;aud.onerror=()=>{if(!fin&&my===tok){fin=true;sayTTS(e,onEnd,my)}};aud.src=e.audio;aud.playbackRate=rate<.8?.8:1;
  const pr=aud.play();if(pr&&pr.catch)pr.catch(()=>{if(!fin&&my===tok){fin=true;sayTTS(e,onEnd,my)}});return}
 sayTTS(e,onEnd,my)}
function sayTTS(e,onEnd,my){if(!synth){onEnd&&onEnd();return}
 const base=CH[ids(e.c)[0]]||{g:'n',p:1};const fr=!!e.fr;const g=GROUPS[e.c]&&e.c!=='narr'?'n':base.g;
 let v=pickVoice(fr?'fr':'en',g),lg=fr?'fr-FR':'en-US';
 if(fr&&!v){v=pickVoice('en',g);if(!frWarned){frWarned=true;toast(t('noFr'))}}
 const parts=e.x.match(/[^.!?…]+[.!?…]*\s*/g)||[e.x];let i=0,finished=false;
 const fin=()=>{if(finished||my!==tok)return;finished=true;onEnd&&onEnd()};
 const nxt=(retry)=>{if(my!==tok)return;if(i>=parts.length){fin();return}
  const txt=parts[i].trim();if(!txt){i++;nxt();return}
  const u=new SpeechSynthesisUtterance(txt);u.lang=lg;if(v)u.voice=v;u.rate=rate;u.pitch=Math.max(.1,Math.min(2,base.p));
  let started=false,ended=false;u.onstart=()=>{started=true};
  u.onend=()=>{if(ended)return;ended=true;i++;setTimeout(()=>nxt(false),60)};
  u.onerror=ev=>{if(ended||my!==tok)return;ended=true;
   if(!retry&&ev.error!=='interrupted'&&ev.error!=='canceled'){v=pickVoice('en',g);lg='en-US';nxt(true)}else{i++;nxt(false)}};
  window._u=u;synth.speak(u);
  setTimeout(()=>{if(!started&&!ended&&my===tok&&!retry){ended=true;synth.cancel();v=pickVoice('en',g);lg='en-US';nxt(true)}},2500)};
 if(synth.paused)synth.resume();
 nxt(false)}
function toast(m){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}el.textContent=m;el.className='show';clearTimeout(el._t);el._t=setTimeout(()=>el.className='',6000)}

 for(let j=k-1;j>=0;j--){if(L[j].k==='line'){prev=L[j];break}if(L[j].k==='cue')cb.unshift(L[j])}
 for(let j=k+1;j<L.length;j++){if(L[j].k==='line'){next=L[j];break}if(L[j].k==='cue')ca.push(L[j])}
 return {prev,next,cb,ca}}
function seqCard(o,me,k){const {e}=o,c=ctxOf(o.ai,e),key=me+'|'+e.id,isD=done.has(key);
 const side=(x,lbl)=>x?`<div class="side ${isMine(x,me)?'alsomine':''}"><div class="sl">${lbl}</div><div class="sb"><b>${esc(nameOf(x.c))}</b>${x.d?` <i>(${esc(x.d)})</i>`:''}<div>${esc(x.x)}</div>${x.fr?`<div class="tr"><b>${t('means')}:</b> ${esc(x.tr[lang])}</div>`:''}</div><button class="mini" data-say="${x.id}" aria-label="${t('listen')}">${ICO.play}<span class="sr">${t('listen')}</span></button></div>`:`<div class="side none"><div class="sl">${lbl}</div><div class="sb muted">${lbl===t('before')?t('startAct'):t('endAct')}</div></div>`;

 const seq=[c.prev,e,c.next].filter(Boolean).map(x=>x.id).join(',');
 return `<div class="lc seqc ${isD?'done':''}" id="S${e.id}">${side(c.prev,t('before'))}${cues(c.cb)}
 <div class="me"><div class="sl">${t('you')}</div>${grp}${body}<div class="la"><button class="pill p-blue" data-say="${e.id}">${ICO.play} <span>${t('listen')}</span></button><button class="pill ${isD?'p-green':'p-ghost'}" data-done="${key}">${ICO.check} ${isD?t('ready'):t('mark')}</button></div></div>

/* ---- ensayo ---- */
let R=null;
function buildSteps(ai){const st=[];let pre=[];ACTS[ai].e.forEach(e=>{if(e.k==='dir'){pre.push(e.x);return}if(e.k==='scene')return;st.push(Object.assign({pre:pre.slice()},e));pre=[]});return st}
function vRehearse(id,act){if(!R||R.id!==id||R.act!==act){stopVoice();R={id,act,steps:buildSteps(act-1),i:0,playing:false,reveal:false}}
 const s=R.steps[R.i],mine=isMine(s,id),last=R.i===R.steps.length-1;
 let prevL=null;for(let j=R.i-1;j>=0;j--)if(R.steps[j].k==='line'){prevL=R.steps[j];break}
 let nextL=null;for(let j=R.i+1;j<R.steps.length;j++)if(R.steps[j].k==='line'){nextL=R.steps[j];break}
 let card;
 if(s.k==='cue'){card=`<div class="now"><div class="cue">${cueIco(s)}<span>${esc(cueLbl(s))}</span></div></div>`}
 else{const who=s.c;let body;
  if(mine&&!R.reveal&&hintLv===2)body=`<button class="veil" data-rh="1">${t('tap')}</button>`;
  else if(mine&&!R.reveal&&hintLv===1)body=`${s.d?`<div class="paren">(${esc(s.d)})</div>`:''}<div class="lt">${esc(hintText(s.x))}</div><button class="pill p-ghost" style="margin-top:10px" data-rh="1">${t('reveal')}</button>`;
  else body=lineText(s);
  const tbd=who==='narr'?` <small>(${t('tbd')})</small>`:'';
  card=`<div class="now ${mine?'mine':''}">${mine?`<div class="turn">${t('yourTurn')}</div>`:''}<div class="nb">${s.pre.length?`<div class="pre">${s.pre.map(esc).join(' ')}</div>`:''}<div class="spk">${orn(who)}<div><b>${esc(GROUPS[who]&&who!=='narr'?GROUPS[who].n:who==='narr'?'Narrator':CH[who].n)}${tbd}</b><small>${t('step')} ${R.i+1} ${t('of')} ${R.steps.length}</small></div></div>${body}
  ${mine?`<div class="la"><button class="pill p-blue" data-say-cur="1">${ICO.play} ${t('listenMine')}</button></div>`:''}</div></div>`}
 const end=last?`<div class="end"><h3>${act===4?t('endPlay'):t('endT')}</h3><div>${t('endS')}</div>${act<4&&myCount(id,act)?`<button class="pill p-gold" style="margin-top:14px" data-go="rehearse-${id}-${act+1}">${t('nextAct')} ${ACTS[act].n} ${ICO.right}</button>`:''}${act===4?`<q>${esc(STORY[lang].quote)}</q>`:''}</div>`:'';
 const playLbl=R.playing?`${ICO.pause} ${t('pause')}`:mine?`${ICO.play} ${t('cont')}`:`${ICO.play} ${t('play')}`;
 return top(CH[id].n+' · '+t('act')+' '+ACTS[act-1].n,'char-'+id)+`<main class="wrap narrow stage">
 <div class="tools"><span class="lbl">${t('hint')}</span><div class="seg">${[t('full'),t('hints'),t('hidden')].map((l,k)=>`<button data-hint="${k}" class="${hintLv===k?'on':''}">${l}</button>`).join('')}</div>
 <span class="lbl">${t('speed')}</span><div class="seg"><button data-rate=".6" class="${rate<.8?'on':''}">${t('slow')}</button><button data-rate=".9" class="${rate>=.8?'on':''}">${t('normal')}</button></div></div>
 ${prevL?`<div class="prev"><b>${esc(nameOf(prevL.c))}:</b> ${esc(prevL.x.length>140?prevL.x.slice(0,140)+'…':prevL.x)}</div>`:''}${card}
 ${nextL&&!mine?`<div class="nextp">${t('next')}: <b>${esc(nameOf(nextL.c))}</b>${isMine(nextL,id)?' ⭐':''}</div>`:''}${end}
 ${synth?'':`<div class="warn">${t('noVoice')}</div>`}</main>
 <div class="dock"><div class="wrap narrow"><div class="bar"><i style="width:${(R.i+1)/R.steps.length*100}%"></i></div><div class="row">
 <button class="pill p-ghost" data-nav="-1" ${R.i===0?'disabled':''} aria-label="${t('prev')}">${ICO.left}</button>
 <button class="pill ${mine&&!R.playing?'p-gold':'p-red'} play" data-play="1">${playLbl}</button>
 <button class="pill p-ghost" data-jump="1" aria-label="${t('jump')}" title="${t('jump')}">⭐ ${ICO.right}</button>
 <button class="pill p-ghost" data-nav="1" ${last?'disabled':''} aria-label="${t('next')}">${ICO.right}</button></div></div></div>`}
let cueTimer=null;
function rhRun(){clearTimeout(cueTimer);if(!R||!R.playing)return;const s=R.steps[R.i];
 if(isMine(s,R.id)){R.playing=false;R.reveal=false;render();return}
 render();
 if(s.k==='cue'){cueTimer=setTimeout(rhAdv,1600);return}
 say(s,()=>{if(R&&R.playing)setTimeout(rhAdv,250)})}
function rhAdv(){if(!R)return;if(R.i>=R.steps.length-1){R.playing=false;render();return}R.i++;R.reveal=false;rhRun()}
function rhStop(){R&&(R.playing=false);clearTimeout(cueTimer);stopVoice()}

/* ---- lector de acto ---- */
let A=null;
function vFocus(n,id){const ai=n-1,a=ACTS[ai];const list=a.e.filter(e=>isMine(e,id)).map(e=>({e,ai}));
 return top(t('act')+' '+a.n+' · '+CH[id].n,'act-'+n)+`<main class="wrap narrow">${chipBar(n,id)}
 <div class="who" style="margin-top:6px">${orn(id)}<div><h2>${esc(CH[id].n)}</h2><p>${t('act')} ${a.n} · ${list.length} ${list.length===1?t('line'):t('lines')}</p></div></div>
 <p class="lead">${t('focusL')}</p>
 <div class="tools"><span class="lbl">${t('speed')}</span><div class="seg"><button data-rate=".6" class="${rate<.8?'on':''}">${t('slow')}</button><button data-rate=".9" class="${rate>=.8?'on':''}">${t('normal')}</button></div>
 <span class="lbl">${t('practice')}</span><div class="seg"><button data-hide="0" class="${hideMine?'':'on'}">${t('show')}</button><button data-hide="1" class="${hideMine?'on':''}">${t('hideM')}</button></div>
 <button class="pill p-red" data-go="rehearse-${id}-${n}">${ICO.mask} ${t('rehearse')}</button></div>
 ${list.map((o,k)=>seqCard(o,id,k)).join('')}${foot()}</main>`}
function chipBar(n,sel){const chars=IDS.filter(id=>myCount(id,n-1));
 return `<div class="chipsT">${t('whoAct')}</div><div class="pick"><button class="pc ${sel?'':'on'}" data-go="act-${n}"><span class="all">${ICO.scroll}</span><b>${t('wholeAct')}</b></button>${chars.map(id=>`<button class="pc ${sel===id?'on':''}" data-go="act-${n}-${id}">${orn(id)}<b>${esc(CH[id].n)}</b><small>${myCount(id,n-1)}</small></button>`).join('')}</div>`}
function vAct(n){const a=ACTS[n-1];if(!A||A.n!==n){stopVoice();A={n,cur:null,playing:false,hl:''}}
const rows=a.e.map(e=>{if(e.k==='scene')return `<h3 class="sc">${esc(e.x)}</h3>`;if(e.k==='dir')return `<div class="dr">${esc(e.x)}</div>`;
  if(e.k==='cue')return `<div class="cueR">${cueIco(e)}<span>${esc(cueLbl(e))}</span></div>`;
  const hl=A.hl&&isMine(e,A.hl);
  return `<div class="row line ${hl?'hl':''} ${A.cur===e.id?'cur':''}" id="L${e.id}">${orn(e.c)}<div><button class="one" data-one="${e.id}" aria-label="${t('listen')}">${ICO.play}</button><div class="nm" style="color:${colOf(e.c)==='#D9A21B'?'var(--gold2)':colOf(e.c)}">${esc(nameOf(e.c))}</div>${e.d?`<div class="paren">(${esc(e.d)})</div>`:''}<div class="tx">${esc(e.x)}</div>${e.fr?`<div class="tr"><b>${t('means')}:</b> ${esc(e.tr[lang])}</div>`:''}</div></div>`}).join('');
 return top(t('act')+' '+a.n+' · '+a.t[lang],'acts')+`<main class="wrap narrow stage">${chipBar(n,'')}<p class="lead">${t('readS')}</p>
 <div class="tools"><span class="lbl">${t('speed')}</span><div class="seg"><button data-rate=".6" class="${rate<.8?'on':''}">${t('slow')}</button><button data-rate=".9" class="${rate>=.8?'on':''}">${t('normal')}</button></div></div>
 <div class="script">${rows}</div>${n<4?`<button class="ticket ${ACTS[n].cls}" style="width:100%;margin-top:16px" data-go="act-${n+1}"><span class="n">${t('nextAct')} ${ACTS[n].n}</span><span class="s">${esc(ACTS[n].t[lang])}</span></button>`:`<div class="end"><h3>${t('endPlay')}</h3><q>${esc(STORY[lang].quote)}</q></div>`}</main>
 <div class="dock"><div class="wrap narrow"><div class="row"><button class="pill p-ghost ${A.cur&&!A.playing?'':'hidden'}" id="actRestart" data-restart="1" title="${t('restart')}" aria-label="${t('restart')}">↺</button><button class="pill p-green play" id="actPlay" data-actplay="1" style="max-width:none"></button></div></div></div>`}
function actLines(){return ACTS[A.n-1].e.filter(e=>e.k==='line')}
function actMark(scroll){document.querySelectorAll('.script .row.cur').forEach(r=>r.classList.remove('cur'));if(A.cur){const el=document.getElementById('L'+A.cur);if(el){el.classList.add('cur');if(scroll)el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}}
 const b=document.getElementById('actPlay');if(b)b.innerHTML=A.playing?ICO.pause+' '+t('stop'):ICO.play+' '+(A.cur?t('fromHere'):t('playAll'));const r=document.getElementById('actRestart');if(r)r.classList.toggle('hidden',!A.cur||A.playing)}
function actPlayFrom(eid){const ls=actLines();let k=ls.findIndex(e=>e.id===eid);if(k<0)k=0;A.playing=true;
 const go=()=>{if(!A||!A.playing)return;if(k>=ls.length){A.playing=false;A.cur=null;actMark(false);return}const e=ls[k];A.cur=e.id;actMark(true);say(e,()=>{k++;setTimeout(go,250)})};go()}

/* ---- historia y producción ---- */
function vStory(){const s=STORY[lang];return top(t('story'),'')+`<main class="wrap narrow read">
 <h3>${t('syn')}</h3>${s.syn.map(p=>`<p>${esc(p)}</p>`).join('')}
 <h3>${t('tale')}</h3>${s.tale.map(p=>`<p>${esc(p)}</p>`).join('')}
 <h3>${t('epi')}</h3>${s.epi.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="quote">${esc(s.quote)}</div>
 <h3>${t('fin')}</h3>${s.fin.map(p=>`<p>${esc(p)}</p>`).join('')}${foot()}</main>`}
function vProd(){const p=PROD[lang];return top(t('prod'),'')+`<main class="wrap narrow read">
 <h3>${t('time')}</h3><p>${esc(p.time)}</p>
 <h3>${t('roles')}</h3><div class="chips">${IDS.map(id=>`<span class="chip">${esc(CH[id].n)}</span>`).join('')}</div>
 <h3>${t('ens')}</h3><div class="chips">${p.ens.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><p class="muted">${esc(p.ensN)}</p>
 <h3>${t('sets')}</h3><div class="chips">${p.sets.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><p class="muted">${esc(p.setsN)}</p>
 <h3>${t('cos')}</h3><p>${esc(p.cos)}</p><div class="chips">${p.pal.map((x,i)=>`<span class="chip sw"><i style="background:${PAL[i]}"></i>${esc(x)}</span>`).join('')}</div>
 <h3>${t('light')}</h3><p>${esc(p.lightN)}</p><div class="lights">${p.lights.map(l=>`<div><b>${esc(l[0])}</b><span>${esc(l[1])}</span></div>`).join('')}</div>
 <h3>${t('props')}</h3><div class="chips">${p.props.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
 <h3>${t('music')}</h3><p>${esc(p.music)}</p>
 <h3>${t('dn')}</h3><p>${esc(p.dn1)}</p>${Object.entries(NOTES).map(([id,n])=>`<div class="note"><b>${esc(CH[id].n)}</b>${esc(n[lang])}</div>`).join('')}<p>${esc(p.dn2)}</p>${foot()}</main>`}

/* ================= RUTAS ================= */
let route='';
function render(){const h=location.hash.slice(1);const p=h.split('-');let html;
 if(h!==route){rhStop();if(A){A.playing=false}window.scrollTo(0,0);route=h}
 if(!h)html=vHome();
 else if(h==='cast')html=vCast();
 else if(p[0]==='char')html=vChar(p[1]);
 else if(p[0]==='lines'&&CH[p[1]])html=vLines(p[1],p[2]==='all'?'all':+p[2]);
 else if(p[0]==='rehearse'&&CH[p[1]]&&+p[2]>=1&&+p[2]<=4)html=vRehearse(p[1],+p[2]);
 else if(h==='acts')html=top(t('readAct'),'')+`<main class="wrap"><p class="lead" style="margin-top:16px">${t('readS')}</p><div class="acts">${ACTS.map((a,i)=>ticket(i,'act-'+(i+1))).join('')}</div>${foot()}</main>`;
 else if(p[0]==='act'&&+p[1]>=1&&+p[1]<=4)html=(p[2]&&CH[p[2]])?vFocus(+p[1],p[2]):vAct(+p[1]);
 else if(h==='story')html=vStory();
 else if(h==='production')html=vProd();
 else html=vHome();
 document.documentElement.lang=lang;const actN=(p[0]==='act'?p[1]:(p[0]==='rehearse'||p[0]==='lines')&&p[2]!=='all'?p[2]:'');if(/^[1-4]$/.test(actN||''))document.body.dataset.act=actN;else delete document.body.dataset.act;app.innerHTML=html;if(A&&p[0]==='act'&&!p[2])actMark()}
const go=v=>{location.hash=v?'#'+v:'';if(!v)history.replaceState(null,'',location.pathname+location.search),render()};
window.addEventListener('hashchange',render);

/* ================= EVENTOS ================= */
function setPlaying(b,on){b.classList.toggle('playing',on);const s=b.querySelector('span:not(.sr)');if(s&&b.dataset.say)s.textContent=on?t('playing'):t('listen')}
function clearPlaying(){document.querySelectorAll('.playing').forEach(x=>setPlaying(x,false));document.querySelectorAll('.speaking').forEach(x=>x.classList.remove('speaking'))}
const findE=id=>{const [a,i]=id.split('-');return ACTS[a-1].e[i]};
app.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go!==undefined){go(d.go);return}
 if(d.lang){lang=d.lang;store.set('lang',lang);render();return}
 if(d.rate){rate=+d.rate;store.set('rate',rate);render();return}
 if(d.hide!==undefined){hideMine=d.hide==='1';render();return}
 if(d.reveal!==undefined){b.classList.add('hidden');document.getElementById('rv'+d.reveal).classList.remove('hidden');return}
 if(d.done){done.has(d.done)?done.delete(d.done):done.add(d.done);store.set('done',[...done]);const y=scrollY;render();scrollTo(0,y);return}
 if(d.say){const was=b.classList.contains('playing');clearPlaying();stopVoice();if(was)return;setPlaying(b,true);say(findE(d.say),()=>setPlaying(b,false));return}
 if(d.seq){const was=b.classList.contains('playing');clearPlaying();stopVoice();if(was)return;const card=b.closest('.seqc');const list=d.seq.split(',');let k=0;setPlaying(b,true);
  const step=()=>{card.querySelectorAll('.speaking').forEach(x=>x.classList.remove('speaking'));if(k>=list.length){setPlaying(b,false);return}
   const id=list[k++];const btn=card.querySelector(`[data-say="${id}"]`);const box=btn&&btn.closest('.side,.me');if(box)box.classList.add('speaking');
   say(findE(id),()=>setTimeout(step,350))};step();return}
 if(R&&location.hash.startsWith('#rehearse')){
  if(d.hint){hintLv=+d.hint;store.set('hint',hintLv);render();return}
  if(d.rh){R.reveal=true;render();return}
  if(d.sayCur){say(R.steps[R.i]);return}
  if(d.nav){rhStop();R.i=Math.max(0,Math.min(R.steps.length-1,R.i+ +d.nav));R.reveal=false;render();return}
  if(d.jump){rhStop();let j=R.steps.findIndex((s,k)=>k>R.i&&isMine(s,R.id));if(j<0)j=R.steps.length-1;R.i=j;R.reveal=false;render();return}
  if(d.play){if(R.playing){rhStop();render();return}
   if(isMine(R.steps[R.i],R.id)||R.i===R.steps.length-1&&R.steps[R.i].k!=='line'){if(R.i>=R.steps.length-1){R.i=0}else R.i++}
   R.playing=true;R.reveal=false;rhRun();return}}
 if(A&&/^#act-\d$/.test(location.hash)){
  if(d.actplay){document.querySelectorAll('.one.playing').forEach(x=>x.classList.remove('playing'));if(A.playing){A.playing=false;stopVoice();actMark(false)}else actPlayFrom(A.cur||actLines()[0].id);return}
  if(d.restart){document.querySelectorAll('.one.playing').forEach(x=>x.classList.remove('playing'));A.cur=null;actPlayFrom(actLines()[0].id);return}
  if(d.one){const was=b.classList.contains('playing');A.playing=false;stopVoice();document.querySelectorAll('.one.playing').forEach(x=>x.classList.remove('playing'));A.cur=d.one;actMark(false);if(was)return;b.classList.add('playing');say(findE(d.one),()=>b.classList.remove('playing'));return}}
});
app.addEventListener('change',ev=>{if(ev.target.id==='hlSel'){A.hl=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(!R||!location.hash.startsWith('#rehearse'))return;if(ev.key==='ArrowRight'){rhStop();if(R.i<R.steps.length-1)R.i++;R.reveal=false;render()}if(ev.key==='ArrowLeft'){rhStop();if(R.i>0)R.i--;R.reveal=false;render()}if(ev.key===' '&&ev.target===document.body){ev.preventDefault();document.querySelector('[data-play]')?.click()}});
render();
}
</script>
</body>
</html>
